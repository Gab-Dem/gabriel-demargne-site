<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".13"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;fill:#171717}.small{font-size:21px;letter-spacing:1.8px}.body{font-size:26px}.muted{fill:#70706c}.line{stroke:#171717;stroke-width:2;fill:none}.note{stroke:#171717;stroke-width:1.5;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#eee9df"/>
  <text x="78" y="72" class="small muted">DEFINE / OPPORTUNITY FRAMING</text>
  <text x="78" y="140" font-size="57">Orientation with incomplete time information</text>
  <text x="78" y="188" class="body muted">A provisional problem statement—not a selected feature set.</text>

  <g transform="translate(78 278)">
    <g transform="rotate(-1 335 120)"><rect width="670" height="235" rx="2" fill="#f1d99a" class="note"/><text x="32" y="54" class="small muted">HMW / HORIZON</text><text x="32" y="104" class="body">How might we help someone orient</text><text x="32" y="140" class="body">themselves without assuming they</text><text x="32" y="176" class="body">plan an entire year?</text></g>
    <g transform="translate(770 0) rotate(1 335 120)"><rect width="670" height="235" rx="2" fill="#c7d9e7" class="note"/><text x="32" y="54" class="small muted">HMW / UNCERTAINTY</text><text x="32" y="104" class="body">How might we show approximate,</text><text x="32" y="140" class="body">delayed, or unknown dates without</text><text x="32" y="176" class="body">inventing precision?</text></g>
    <g transform="translate(0 300) rotate(1 335 120)"><rect width="670" height="235" rx="2" fill="#cfe0ae" class="note"/><text x="32" y="54" class="small muted">HMW / DECISION</text><text x="32" y="104" class="body">How might we connect future context</text><text x="32" y="140" class="body">to an immediate choice without</text><text x="32" y="176" class="body">building another recommendation feed?</text></g>
    <g transform="translate(770 300) rotate(-1 335 120)"><rect width="670" height="235" rx="2" fill="#efbea9" class="note"/><text x="32" y="54" class="small muted">HMW / MAINTENANCE</text><text x="32" y="104" class="body">How might we reduce repeated lookup</text><text x="32" y="140" class="body">without creating another tracking</text><text x="32" y="176" class="body">routine to maintain?</text></g>
  </g>

  <line x1="78" y1="868" x2="1522" y2="868" class="line"/>
  <text x="78" y="918" class="body" fill="#a60000">Research can narrow, merge, or reject all four questions.</text>
</svg>
