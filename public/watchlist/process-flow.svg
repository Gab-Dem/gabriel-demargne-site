<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#eee9df"/><defs><filter id="shadow"><feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".15"/></filter></defs><style>text{font-family:Arial,sans-serif;fill:#171717}.small{font-size:22px;letter-spacing:2px}.body{font-size:27px}.muted{fill:#777}.line{stroke:#171717;stroke-width:2;fill:none}.note{filter:url(#shadow);stroke:#171717;stroke-width:1}</style>
  <text x="80" y="80" class="small muted">Process flow / returning behaviour</text><text x="80" y="160" font-size="62">From noticing a show</text><text x="80" y="225" font-size="62">to choosing what to watch</text>
  <g transform="translate(100 400)"><path d="M120 80h190m170 0h190m170 0h190m170 0h190" class="line"/><path d="m295 65 18 15-18 15m360-15 18 15-18 15m360-15 18 15-18 15m360-15 18 15-18 15" class="line"/>
  <g><g transform="rotate(-3 80 80)"><rect x="5" y="20" width="150" height="120" fill="#f2d990" class="note"/><text x="35" y="150" class="body">Notice</text><text x="0" y="205" class="body muted">Hear about it</text></g><g transform="translate(360) rotate(3 80 80)"><rect x="5" y="20" width="150" height="120" fill="#cbdc9c" class="note"/><text x="35" y="150" class="body">Collect</text><text x="0" y="205" class="body muted">Add to watchlist</text></g><g transform="translate(720) rotate(-2 80 80)"><rect x="5" y="20" width="150" height="120" fill="#b8d1e2" class="note"/><text x="30" y="150" class="body">Orient</text><text x="0" y="205" class="body muted">See when it fits</text></g><g transform="translate(1080) rotate(3 80 80)"><rect x="5" y="20" width="150" height="120" fill="#f0b8a6" class="note"/><text x="35" y="150" class="body">Choose</text><text x="0" y="205" class="body muted">Watch or wait</text></g></g>
  </g><text x="100" y="820" class="body muted">The product is designed for the return visit — not a one-off search.</text>
</svg>
