<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".12"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;fill:#171717}.small{font-size:18px;letter-spacing:1.5px}.body{font-size:22px}.label{font-size:24px;font-weight:600}.muted{fill:#6e6e69}.line{stroke:#171717;stroke-width:2;fill:none}.soft{stroke:#a9a9a3;stroke-width:1.5;fill:none}.panel{fill:#fff;stroke:#171717;stroke-width:1.5;filter:url(#shadow)}.chip{fill:#f1efe8;stroke:#171717;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f3ee"/>
  <text x="72" y="68" class="small muted">EXPLORE / FIRST-PASS INTERACTION MODELS</text>
  <text x="72" y="132" font-size="56">What should organise the collection?</text>
  <text x="72" y="178" class="body muted">Three models remain visible so the prototype direction does not look inevitable.</text>

  <g transform="translate(72 248)">
    <g>
      <rect width="450" height="620" class="panel"/>
      <text x="28" y="48" class="small muted">CONCEPT A</text><text x="28" y="88" class="label">Annual release map</text>
      <g transform="translate(28 132)">
        <rect width="394" height="248" fill="#faf9f6" stroke="#171717" stroke-width="1.5"/>
        <text x="12" y="28" font-size="12" class="muted">JAN  FEB  MAR  APR  MAY  JUN  JUL  AUG  SEP  OCT  NOV  DEC</text>
        <line x1="0" y1="50" x2="394" y2="50" class="soft"/><line x1="0" y1="100" x2="394" y2="100" class="soft"/><line x1="0" y1="150" x2="394" y2="150" class="soft"/><line x1="0" y1="200" x2="394" y2="200" class="soft"/>
        <rect x="92" y="65" width="96" height="20" fill="#c7d9e7"/><rect x="196" y="115" width="132" height="20" fill="#cfe0ae"/><rect x="305" y="165" width="55" height="20" fill="#efbea9"/><rect x="24" y="215" width="210" height="14" fill="none" stroke="#8c5f10" stroke-dasharray="6 5"/>
      </g>
      <text x="28" y="426" class="small muted">HELPS NOTICE</text><text x="28" y="460" class="body">Overlap, gaps, seasonal shape</text>
      <text x="28" y="510" class="small muted">TRADE-OFF</text><text x="28" y="544" class="body">Dense on mobile; uncertain dates</text><text x="28" y="576" class="body">can look falsely precise.</text>
    </g>

    <g transform="translate(503 0)">
      <rect width="450" height="620" class="panel"/>
      <text x="28" y="48" class="small muted">CONCEPT B</text><text x="28" y="88" class="label">Next-up queue</text>
      <g transform="translate(28 132)">
        <rect width="394" height="248" fill="#faf9f6" stroke="#171717" stroke-width="1.5"/>
        <text x="14" y="27" font-size="14" class="muted">NEXT 30 DAYS</text>
        <line x1="0" y1="48" x2="394" y2="48" class="soft"/>
        <text x="14" y="82" font-size="16">NOW</text><text x="86" y="82" font-size="18" font-weight="600">Low Tide</text><rect x="300" y="62" width="76" height="26" class="chip"/><text x="313" y="80" font-size="12">Available</text>
        <line x1="14" y1="102" x2="380" y2="102" class="soft"/>
        <text x="14" y="137" font-size="16">07 AUG</text><text x="86" y="137" font-size="18" font-weight="600">North Star</text><rect x="300" y="117" width="76" height="26" class="chip"/><text x="311" y="135" font-size="12">Confirmed</text>
        <line x1="14" y1="157" x2="380" y2="157" class="soft"/>
        <text x="14" y="192" font-size="16">SEP?</text><text x="86" y="192" font-size="18" font-weight="600">Glass House</text><rect x="300" y="172" width="76" height="26" fill="#fff" stroke="#8c5f10" stroke-dasharray="5 4"/><text x="309" y="190" font-size="12">Expected</text>
      </g>
      <text x="28" y="426" class="small muted">HELPS NOTICE</text><text x="28" y="460" class="body">Immediate sequence and action</text>
      <text x="28" y="510" class="small muted">TRADE-OFF</text><text x="28" y="544" class="body">Weak long-range orientation;</text><text x="28" y="576" class="body">future items disappear from view.</text>
    </g>

    <g transform="translate(1006 0)">
      <rect width="450" height="620" class="panel"/>
      <text x="28" y="48" class="small muted">CONCEPT C / PROTOTYPE</text><text x="28" y="88" class="label">Hybrid planning horizon</text>
      <g transform="translate(28 132)">
        <rect width="394" height="248" fill="#faf9f6" stroke="#171717" stroke-width="1.5"/>
        <rect x="14" y="14" width="65" height="28" class="chip"/><rect x="79" y="14" width="78" height="28" fill="#171717"/><rect x="157" y="14" width="72" height="28" class="chip"/><rect x="229" y="14" width="58" height="28" class="chip"/>
        <text x="28" y="33" font-size="12">7 days</text><text x="92" y="33" font-size="12" fill="#fff">30 days</text><text x="171" y="33" font-size="12">Season</text><text x="242" y="33" font-size="12">Year</text>
        <line x1="14" y1="62" x2="380" y2="62" class="soft"/>
        <text x="14" y="96" font-size="15">07 AUG</text><text x="95" y="96" font-size="18" font-weight="600">North Star</text><text x="302" y="96" font-size="12">Confirmed</text>
        <line x1="14" y1="118" x2="380" y2="118" class="soft"/>
        <text x="14" y="152" font-size="15">14 AUG</text><text x="95" y="152" font-size="18" font-weight="600">Workshop</text><text x="302" y="152" font-size="12">Confirmed</text>
        <line x1="14" y1="174" x2="380" y2="174" class="soft"/>
        <text x="14" y="208" font-size="15">SEP?</text><text x="95" y="208" font-size="18" font-weight="600">Glass House</text><text x="302" y="208" font-size="12" fill="#8c5f10">Approx.</text>
      </g>
      <text x="28" y="426" class="small muted">HELPS NOTICE</text><text x="28" y="460" class="body">Immediate choices with zoom-out</text>
      <text x="28" y="510" class="small muted">TRADE-OFF</text><text x="28" y="544" class="body">Adds modes; continuity between</text><text x="28" y="576" class="body">horizons must be understandable.</text>
    </g>
  </g>

  <line x1="72" y1="914" x2="1528" y2="914" class="line"/>
  <text x="72" y="958" class="body" fill="#a60000">Current choice: prototype C to make planning horizon testable—not because it has been validated.</text>
</svg>
