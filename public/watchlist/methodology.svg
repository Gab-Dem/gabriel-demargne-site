<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".13"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;fill:#171717}
      .small{font-size:21px;letter-spacing:1.8px}.label{font-size:24px;font-weight:600}.body{font-size:24px}.muted{fill:#70706c}.line{stroke:#171717;stroke-width:2;fill:none}.card{stroke:#171717;stroke-width:1.5;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7f6f2"/>
  <text x="78" y="74" class="small muted">WATCHLIST / INVESTIGATION MODEL</text>
  <text x="78" y="142" font-size="58">From ambiguity to evidence-led decisions</text>
  <text x="78" y="190" class="body muted">The process is allowed to move backwards when evidence changes the premise.</text>

  <g transform="translate(78 278)">
    <path d="M242 100H276M526 100H560M810 100H844M1094 100H1128" class="line"/>
    <path d="M1352 194V302M1352 302H1128M1094 402H1060M810 402H776M526 402H492M242 402H208" class="line"/>
    <g transform="rotate(-1 110 100)"><rect width="220" height="194" fill="#f1d99a" class="card"/><text x="24" y="43" class="small muted">01</text><text x="24" y="83" class="label">Frame</text><text x="24" y="122" class="body">Beliefs, scope,</text><text x="24" y="154" class="body">success criteria</text></g>
    <g transform="translate(284 0) rotate(1 110 100)"><rect width="220" height="194" fill="#c7d9e7" class="card"/><text x="24" y="43" class="small muted">02</text><text x="24" y="83" class="label">Landscape</text><text x="24" y="122" class="body">Patterns, gaps,</text><text x="24" y="154" class="body">contradictions</text></g>
    <g transform="translate(568 0) rotate(-1 110 100)"><rect width="220" height="194" fill="#cfe0ae" class="card"/><text x="24" y="43" class="small muted">03</text><text x="24" y="83" class="label">Understand</text><text x="24" y="122" class="body">Real behaviour,</text><text x="24" y="154" class="body">counterexamples</text></g>
    <g transform="translate(852 0) rotate(1 110 100)"><rect width="220" height="194" fill="#efbea9" class="card"/><text x="24" y="43" class="small muted">04</text><text x="24" y="83" class="label">Define</text><text x="24" y="122" class="body">Problem, principles,</text><text x="24" y="154" class="body">opportunities</text></g>
    <g transform="translate(1136 0) rotate(-1 110 100)"><rect width="220" height="194" fill="#d8c6e4" class="card"/><text x="24" y="43" class="small muted">05</text><text x="24" y="83" class="label">Explore</text><text x="24" y="122" class="body">Several models,</text><text x="24" y="154" class="body">visible trade-offs</text></g>

    <g transform="translate(0 304) rotate(1 110 100)"><rect width="220" height="194" fill="#d8c6e4" class="card"/><text x="24" y="43" class="small muted">10</text><text x="24" y="83" class="label">Reflect</text><text x="24" y="122" class="body">What changed,</text><text x="24" y="154" class="body">what remains</text></g>
    <g transform="translate(284 304) rotate(-1 110 100)"><rect width="220" height="194" fill="#efbea9" class="card"/><text x="24" y="43" class="small muted">09</text><text x="24" y="83" class="label">Validate</text><text x="24" y="122" class="body">Observe, revise,</text><text x="24" y="154" class="body">record surprise</text></g>
    <g transform="translate(568 304) rotate(1 110 100)"><rect width="220" height="194" fill="#cfe0ae" class="card"/><text x="24" y="43" class="small muted">08</text><text x="24" y="83" class="label">Prototype</text><text x="24" y="122" class="body">Make behaviour</text><text x="24" y="154" class="body">testable</text></g>
    <g transform="translate(852 304) rotate(-1 110 100)"><rect width="220" height="194" fill="#c7d9e7" class="card"/><text x="24" y="43" class="small muted">07</text><text x="24" y="83" class="label">Wireframe</text><text x="24" y="122" class="body">Purpose, goal,</text><text x="24" y="154" class="body">alternatives</text></g>
    <g transform="translate(1136 304) rotate(1 110 100)"><rect width="220" height="194" fill="#f1d99a" class="card"/><text x="24" y="43" class="small muted">06</text><text x="24" y="83" class="label">Interact</text><text x="24" y="122" class="body">States, flows,</text><text x="24" y="154" class="body">edge cases</text></g>
  </g>

  <g transform="translate(78 870)">
    <line x1="0" y1="0" x2="1444" y2="0" class="line"/>
    <text x="0" y="48" class="small" fill="#2756d8">DECISION LOG RUNS THROUGHOUT</text>
    <text x="470" y="48" class="body muted">Decision · reasoning · evidence · alternatives · remaining uncertainty</text>
  </g>
</svg>
