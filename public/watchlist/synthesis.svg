<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#eee9df"/><defs><filter id="shadow"><feDropShadow dx="5" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".16"/></filter></defs><style>text{font-family:Arial,sans-serif;fill:#171717}.small{font-size:22px;letter-spacing:2px}.body{font-size:28px}.muted{fill:#777}.line{stroke:#171717;stroke-width:2;fill:none}.note{filter:url(#shadow);stroke:#171717;stroke-width:1}</style>
  <text x="80" y="80" class="small muted">Synthesis / four needs</text><text x="80" y="160" font-size="62">The need is a sense of time,</text><text x="80" y="225" font-size="62">not more titles</text>
  <g transform="translate(90 360)">
    <g transform="rotate(-3 155 185)"><rect width="310" height="370" fill="#f2d990" class="note"/><text x="35" y="65" class="small">01 / Remember</text><text x="35" y="160" class="body">Keep a personal</text><text x="35" y="202" class="body">collection intact.</text><text x="35" y="310" class="body">“What did I want</text><text x="35" y="350" class="body">to watch?”</text></g>
    <g transform="translate(350) rotate(2 155 185)"><rect width="310" height="370" fill="#cbdc9c" class="note"/><text x="35" y="65" class="small">02 / Anticipate</text><text x="35" y="160" class="body">Know when a</text><text x="35" y="202" class="body">season arrives.</text><text x="35" y="310" class="body">“What is coming</text><text x="35" y="350" class="body">up next?”</text></g>
    <g transform="translate(700) rotate(-2 155 185)"><rect width="310" height="370" fill="#b8d1e2" class="note"/><text x="35" y="65" class="small">03 / Locate</text><text x="35" y="160" class="body">Find the right</text><text x="35" y="202" class="body">place to watch.</text><text x="35" y="310" class="body">“Where is it</text><text x="35" y="350" class="body">available?”</text></g>
    <g transform="translate(1050) rotate(3 155 185)"><rect width="310" height="370" fill="#f0b8a6" class="note"/><text x="35" y="65" class="small">04 / Decide</text><text x="35" y="160" class="body">Choose without</text><text x="35" y="202" class="body">starting again.</text><text x="35" y="310" class="body">“What should I</text><text x="35" y="350" class="body">watch tonight?”</text></g>
  </g>
  <text x="90" y="860" class="body muted">A list stores titles. A time-based view shows relationships.</text>
</svg>
