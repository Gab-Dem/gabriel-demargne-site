<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 235 1600 430">
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#18181b}.kicker{font-size:15px;font-weight:650;letter-spacing:1.2px}.title{font-size:50px;font-weight:720;letter-spacing:-1.6px}.heading{font-size:22px;font-weight:680;letter-spacing:-.3px}.body{font-size:17px}.small{font-size:14px}.tiny{font-size:12px;font-weight:600}.muted{fill:#71717a}.inverse{fill:#fff}.card{fill:#fff;stroke:#e4e4e7;stroke-width:2}.panel{fill:#fafafa;stroke:#e4e4e7;stroke-width:2}.soft{fill:#f4f4f5}.dark{fill:#18181b}.line{stroke:#e4e4e7;stroke-width:2}.chevron{fill:none;stroke:#a1a1aa;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1600" height="900" fill="#fff"/>
  <g transform="translate(108 307)">
    <rect width="256" height="286" rx="12" class="panel"/>
    <rect x="20" y="20" width="42" height="28" rx="14" class="soft"/>
    <text x="34" y="39" class="tiny">01</text>
    <text x="20" y="88" class="heading">Frame</text>
    <text x="20" y="122" class="body">What needs to be</text>
    <text x="20" y="148" class="body">understood?</text>
    <rect x="20" y="226" width="116" height="34" rx="17" class="card"/>
    <text x="36" y="248" class="tiny muted">Starting point</text>
  </g>
  <path d="M374 442l8 8-8 8" class="chevron"/>

  <g transform="translate(390 307)">
    <rect width="256" height="286" rx="12" class="panel"/>
    <rect x="20" y="20" width="42" height="28" rx="14" class="soft"/>
    <text x="34" y="39" class="tiny">02</text>
    <text x="20" y="88" class="heading">Landscape</text>
    <text x="20" y="122" class="body">What do current</text>
    <text x="20" y="148" class="body">tools support?</text>
    <rect x="20" y="226" width="112" height="34" rx="17" class="card"/>
    <text x="36" y="248" class="tiny muted">Benchmark</text>
  </g>
  <path d="M656 442l8 8-8 8" class="chevron"/>

  <g transform="translate(672 307)">
    <rect width="256" height="286" rx="12" class="dark"/>
    <rect x="20" y="20" width="42" height="28" rx="14" fill="#3f3f46"/>
    <text x="34" y="39" class="tiny inverse">03</text>
    <text x="20" y="88" class="heading inverse">Behaviour</text>
    <text x="20" y="122" class="body inverse">How do people handle</text>
    <text x="20" y="148" class="body inverse">this today?</text>
    <rect x="20" y="226" width="92" height="34" rx="17" fill="#fff"/>
    <text x="36" y="248" class="tiny">Interviews</text>
  </g>
  <path d="M938 442l8 8-8 8" class="chevron"/>

  <g transform="translate(954 307)">
    <rect width="256" height="286" rx="12" class="panel"/>
    <rect x="20" y="20" width="42" height="28" rx="14" class="soft"/>
    <text x="34" y="39" class="tiny">04</text>
    <text x="20" y="88" class="heading">Explore</text>
    <text x="20" y="122" class="body">Compare different</text>
    <text x="20" y="148" class="body">kinds of support.</text>
    <rect x="20" y="226" width="88" height="34" rx="17" class="card"/>
    <text x="36" y="248" class="tiny muted">Concepts</text>
  </g>
  <path d="M1220 442l8 8-8 8" class="chevron"/>

  <g transform="translate(1236 307)">
    <rect width="256" height="286" rx="12" class="panel"/>
    <rect x="20" y="20" width="42" height="28" rx="14" class="soft"/>
    <text x="34" y="39" class="tiny">05</text>
    <text x="20" y="88" class="heading">Learn</text>
    <text x="20" y="122" class="body">Keep, change</text>
    <text x="20" y="148" class="body">or stop.</text>
    <rect x="20" y="226" width="88" height="34" rx="17" class="card"/>
    <text x="36" y="248" class="tiny muted">Next step</text>
  </g>

</svg>
